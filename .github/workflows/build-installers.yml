name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Setup
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock

      - name: Install dependencies
        shell: pwsh
        env:
          npm_config_arch: x64
          TARGET_ARCH: x64
        run: yarn

      - name: Build production app
        shell: pwsh
        env:
          NODE_ENV: production
          RELEASE_CHANNEL: production
          NODE_OPTIONS: --max_old_space_size=8192
          npm_config_arch: x64
          TARGET_ARCH: x64
        run: yarn build:prod

      - name: Collect runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = 'dist/Kintsugi-win32-x64'
          if (-not (Test-Path -LiteralPath (Join-Path $src 'Kintsugi.exe'))) {
            throw "Expected $src/Kintsugi.exe was not built"
          }
          New-Item -ItemType Directory -Force -Path app-dist | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination app-dist -Recurse -Force
          Get-ChildItem app-dist | Select-Object -First 30

      - name: Ensure the release exists
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME -R $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME -R $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'could not create the release' }
          }

      - name: Pack with GloriaSetup
        uses: projectGloria/GloriaSetup@v0.1.0
        with:
          app-dir: app-dist
          manifest: gloria.toml
          certificate: ${{ secrets.WINDOWS_PFX_BASE64 }}
          certificate-password: ${{ secrets.WINDOWS_PFX_PASSWORD }}
