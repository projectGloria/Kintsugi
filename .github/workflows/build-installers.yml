name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            app/yarn.lock

      - name: Install dependencies
        shell: pwsh
        env:
          npm_config_arch: x64
          TARGET_ARCH: x64
        run: yarn

      - name: Build production app
        shell: pwsh
        env:
          NODE_ENV: production
          RELEASE_CHANNEL: production
          NODE_OPTIONS: --max_old_space_size=8192
          npm_config_arch: x64
          TARGET_ARCH: x64
        run: yarn build:prod

      - name: Package Windows installer
        shell: pwsh
        env:
          NODE_ENV: production
          RELEASE_CHANNEL: production
          npm_config_arch: x64
          TARGET_ARCH: x64
        run: yarn package

      - name: Collect installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = (Get-Content app/package.json -Raw | ConvertFrom-Json).version
          }

          $source = 'dist/KintsugiSetup-x64.exe'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Expected installer not found at $source"
          }

          New-Item -ItemType Directory -Force -Path installers | Out-Null
          $target = "installers/kintsugi-$version-windows-x64.exe"
          Copy-Item -LiteralPath $source -Destination $target -Force
          Get-ChildItem installers

      - name: Upload installers artifact
        uses: actions/upload-artifact@v7
        with:
          name: installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v8
        with:
          name: installers
          path: installers

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
